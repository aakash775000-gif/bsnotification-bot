name: Check Blogger and Post to Telegram

on:
  schedule:
    # Har 15 minute me automatically run hoga
    - cron: '*/15 * * * *'
  workflow_dispatch: # Manual test button ke liye

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests feedparser

      - name: Run Bot Script
        run: |
          python bot.py

      - name: Commit and Push Updated ID
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_posted_id.txt
          git diff --staged --quiet || (git commit -m "Update last posted id" && git push)
